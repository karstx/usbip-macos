name: Test & Build

on: [push]

env:
  CARGO_TERM_COLOR: always

jobs:
  nix-build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - uses: cachix/cachix-action@v14
      with:
        name: usbip-macos
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Build
      run: nix build

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ./target
          key: test-cargo-registry
      - name: Lint
        run: cargo fmt -- --check

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ./target
          key: test-cargo-registry
      - name: Run tests
        run: cargo test --verbose

  build:
    needs: test
    runs-on: macos-latest
    env:
      NAME: usbip-macos
      # All optional. Without DEVELOPER_ID_P12 the app is signed ad-hoc; the notary key is only
      # used for tags.
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
      PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
      NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v14
        with:
          name: usbip-macos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Set up signing
        if: env.DEVELOPER_ID_P12 != ''
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          PASSWORD=$(uuidgen)
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security import "$RUNNER_TEMP/identity.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/identity.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$PROVISIONING_PROFILE" ]; then
            echo "$PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/usbip.provisionprofile"
            echo "PROFILE=$RUNNER_TEMP/usbip.provisionprofile" >> "$GITHUB_ENV"
          fi
          if [ -n "$NOTARY_KEY" ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            xcrun notarytool store-credentials usbip-notary --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --keychain "$KEYCHAIN"
            echo "NOTARY_PROFILE=usbip-notary" >> "$GITHUB_ENV"
          fi
      - name: Package
        run: |
          if [[ $GITHUB_REF_TYPE =~ ^tag$ ]]; then
            TAG=$GITHUB_REF_NAME
          else
            TAG=$GITHUB_SHA
          fi
          nix run .#package -- ./artifacts
          rm -rf ./artifacts/usbip.app
          # The CLI comes from the plain build: the app's copy carries an entitlement that
          # macOS only honours inside the bundle, next to its provisioning profile.
          nix build
          tar -czf ./artifacts/$NAME-$TAG.tar.gz -C ./result/bin $NAME
      - name: Remove signing keychain
        if: always() && env.DEVELOPER_ID_P12 != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: |
            ./artifacts

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: result
          merge-multiple: true
          path: ./artifacts
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            ./artifacts/*.tar.gz
            ./artifacts/*.dmg
